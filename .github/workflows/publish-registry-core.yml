name: Publish registry-core package

on:
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "packages/registry-core/**"
      - "scripts/build-package.ts"
      - "scripts/check-package*"
      - "scripts/core-imports.ts"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-registry-core.yml"
  workflow_dispatch:

# A publish is never cancelled: a cancelled one can leave a half-written version behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish snapshot to npm.pkg.github.com
    # Dispatch exists to re-run a failed publish of main; no other ref publishes under the official name.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:package
      - run: pnpm build:package

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@centrifuge"

      - name: Publish snapshot
        working-directory: packages/registry-core
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${BASE_VERSION}-sha.${GITHUB_SHA::7}"
          if npm view "@centrifuge/registry-core@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published, skipping"
            exit 0
          fi
          npm version "${VERSION}" --no-git-tag-version
          # npm normalises a version whose sha is all digits with a leading zero to a different one
          WRITTEN=$(node -p "require('./package.json').version")
          if [ "${WRITTEN}" != "${VERSION}" ]; then
            echo "npm wrote version ${WRITTEN}, expected ${VERSION}" >&2
            exit 1
          fi
          npm publish --tag snapshot
          echo "Published @centrifuge/registry-core@${VERSION}"
